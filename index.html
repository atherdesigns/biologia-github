<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Επανάληψη Βιολογίας Β΄ Γυμνασίου σαν ποδοσφαιρική σεζόν: θεωρία, κάρτες, quiz και παιχνίδια.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Βιολογία Β΄ Γυμνασίου</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Commissioner:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column app over a fixed floodlit-pitch backdrop. Glass is the navigation layer only (top bar, tabs, unit cards, answer buttons); reading text stays on solid surfaces. */
:root{
  --bg:#F2F6F3; --surface:#FFFFFF; --surface-2:#E8EFEA; --ink:#12261F; --muted:#56695F; --line:#D3DFD8;
  --accent:#1E8558; --accent-ink:#FFFFFF; --good:#1E8558; --good-bg:#DDF2E6; --bad:#C2363F; --bad-bg:#FBE3E4;
  --c1:#2F9A62; --c2:#C98F0E; --c3:#D9622F; --c4:#CC3A4B; --c5:#3471CF; --c6:#7E55C8;
  --cyto:#EAF3E4; --wall:#7FB069; --nuc:#C9B6E8; --nucl:#8A6CC0; --chl:#3F9A4A; --mito:#E99B4F; --vac:#CFE6F5; --cell-line:#2C4A3E;
  --pitch:#1F7A43; --on-c:#FFFFFF;
  --glass:color-mix(in srgb,var(--surface) 56%,transparent); --glass-strong:color-mix(in srgb,var(--surface) 74%,transparent);
  --glass-blur:blur(22px) saturate(175%); --glass-edge:rgba(255,255,255,.75); --glass-low:rgba(18,38,31,.08); --glass-shadow:rgba(18,50,38,.28); --sheen:rgba(255,255,255,.42);
  --orb-1:rgba(47,170,100,.46); --orb-2:rgba(52,113,207,.34); --orb-3:rgba(233,155,79,.34); --orb-4:rgba(204,58,75,.22); --line-pitch:rgba(30,133,88,.16);
  --display:"Comfortaa","Trebuchet MS",system-ui,sans-serif;
  --body:"Commissioner","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1613; --surface:#15211D; --surface-2:#1C2B26; --ink:#E4EEE8; --muted:#9BB0A6; --line:#293A34;
  --accent:#4CC38A; --accent-ink:#0B1A14; --good:#5CD196; --good-bg:#173527; --bad:#F07A80; --bad-bg:#3A1C20;
  --c1:#56C487; --c2:#E5B23C; --c3:#F08A57; --c4:#EE6778; --c5:#6A9CEB; --c6:#A985E6;
  --cyto:#1F3329; --wall:#6E9E5A; --nuc:#4A3D66; --nucl:#9C82D6; --chl:#5DBA68; --mito:#D98A3F; --vac:#1F3A4D; --cell-line:#A9C7B9; --pitch:#1A5C36; --on-c:#0B1A14; --glass-edge:rgba(255,255,255,.2); --glass-low:rgba(0,0,0,.3); --glass-shadow:rgba(0,0,0,.6); --sheen:rgba(255,255,255,.09); --orb-1:rgba(47,170,100,.34); --orb-2:rgba(52,113,207,.3); --orb-3:rgba(233,155,79,.17); --orb-4:rgba(204,58,75,.2); --line-pitch:rgba(120,220,170,.1);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1613; --surface:#15211D; --surface-2:#1C2B26; --ink:#E4EEE8; --muted:#9BB0A6; --line:#293A34;
  --accent:#4CC38A; --accent-ink:#0B1A14; --good:#5CD196; --good-bg:#173527; --bad:#F07A80; --bad-bg:#3A1C20;
  --c1:#56C487; --c2:#E5B23C; --c3:#F08A57; --c4:#EE6778; --c5:#6A9CEB; --c6:#A985E6;
  --cyto:#1F3329; --wall:#6E9E5A; --nuc:#4A3D66; --nucl:#9C82D6; --chl:#5DBA68; --mito:#D98A3F; --vac:#1F3A4D; --cell-line:#A9C7B9; --pitch:#1A5C36; --on-c:#0B1A14; --glass-edge:rgba(255,255,255,.2); --glass-low:rgba(0,0,0,.3); --glass-shadow:rgba(0,0,0,.6); --sheen:rgba(255,255,255,.09); --orb-1:rgba(47,170,100,.34); --orb-2:rgba(52,113,207,.3); --orb-3:rgba(233,155,79,.17); --orb-4:rgba(204,58,75,.2); --line-pitch:rgba(120,220,170,.1);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
.app{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 18px;flex-wrap:wrap}
.brand{background:none;border:0;padding:0;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.15rem}
.brand svg{width:34px;height:34px;flex:none}
.meter{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;position:relative}
.rank{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 10px;font-weight:600;font-size:.85rem}
.xp{font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem}
.float{position:absolute;right:8px;top:-6px;font-weight:700;color:var(--good);animation:up 1s ease-out forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-26px);opacity:0}}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-bottom:22px}
.hero h1{font-size:clamp(1.7rem,5vw,2.4rem)}
.hero p{color:var(--muted);margin:.5rem 0 0;max-width:46ch}
.progress-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:220px}
.progress-card small{color:var(--muted);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase}
.progress-card b{display:block;font-family:var(--display);font-size:1.2rem;margin:2px 0 8px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.progress-card .next{font-size:.8rem;color:var(--muted);margin-top:6px}

.rapid-cta{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px 18px;margin-bottom:26px}
.rapid-cta h2{font-size:1.15rem}
.rapid-cta p{margin:2px 0 0;opacity:.8;font-size:.92rem}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.rapid-cta .btn{background:var(--bg);color:var(--ink)}

.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.slide{--c:var(--accent);text-align:left;display:grid;grid-template-columns:62px 1fr;min-height:128px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0;overflow:hidden;transition:transform .15s, box-shadow .15s}
.slide:hover{transform:translateY(-3px);box-shadow:0 8px 22px -12px color-mix(in srgb,var(--c) 70%,transparent)}
.slide .label{background:var(--c);color:var(--on-c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 2px,transparent 2px 7px)}
.slide .label span{font-size:.65rem;letter-spacing:.12em;font-weight:700}
.slide .label b{font-size:1.25rem;line-height:1}
.slide .body{padding:12px 14px;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.slide .body::after{content:"";position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--c) 45%,transparent)}
.slide h3{font-size:1.02rem;padding-right:40px}
.slide p{margin:0;color:var(--muted);font-size:.86rem}
.slide .meta{margin-top:auto;display:flex;gap:10px;align-items:center;font-size:.82rem;color:var(--muted)}
.stars{color:var(--c2);letter-spacing:2px;font-size:.95rem}
.stars .off{color:var(--line)}

/* chapter */
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:500;margin-bottom:6px}
.ch-head{--c:var(--accent);border-left:6px solid var(--c);padding:4px 0 4px 14px;margin-bottom:16px}
.ch-head small{color:var(--c);font-weight:700;letter-spacing:.1em;font-size:.75rem}
.ch-head h1{font-size:clamp(1.4rem,4.5vw,2rem)}
.tabs{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:12px;margin-bottom:18px;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.points{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.points li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 40px;position:relative}
.points li::before{content:"";position:absolute;left:15px;top:19px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent))}
.points b{color:var(--ink)}
.fact{margin-top:16px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px dashed var(--c);border-radius:var(--r);padding:14px 16px}
.fact small{font-weight:700;letter-spacing:.08em;font-size:.72rem;color:var(--c);text-transform:uppercase}
.fact p{margin:4px 0 0}
.section-title{font-size:1.05rem;margin:22px 0 10px}

/* cell explorer */
.cell{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:6px}
.cell svg{width:100%;height:auto;display:block}
.cell [data-p]{cursor:pointer;transition:filter .15s}
.cell [data-p].on{filter:drop-shadow(0 0 6px var(--accent))}
.cell [data-p].on:not(.line){stroke:var(--ink);stroke-width:2.5}
.cell .tog{display:flex;gap:6px;margin-bottom:10px}
.cell .tog button{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:.85rem;font-weight:600}
.cell .tog button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:4px 10px;font-size:.82rem}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.info{font-size:.92rem}
.info h3{font-size:1rem;margin-bottom:4px}
.info p{margin:0;color:var(--muted)}
.mag{font-size:.72rem;color:var(--muted);letter-spacing:.08em;font-variant-numeric:tabular-nums}

/* flashcards */
.fc-wrap{perspective:1000px;max-width:520px;margin:0 auto}
.fc{width:100%;height:230px;border:0;background:none;padding:0;position:relative;transform-style:preserve-3d;transition:transform .5s}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line)}
.fc .front{background:var(--surface)}
.fc .front b{font-family:var(--display);font-size:1.5rem;text-align:center}
.fc .back{background:var(--c);color:var(--on-c);transform:rotateY(180deg);font-size:1.02rem;text-align:center}
.fc small{opacity:.7;font-size:.78rem}
.fc-nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;max-width:520px;margin-inline:auto;gap:8px}
.fc-nav span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}

/* quiz */
.qhead{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums}
.combo{color:var(--c3);font-weight:700}
.q{font-size:1.2rem;margin:18px 0 14px}
.opts{display:grid;gap:9px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font-weight:500;transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--c,var(--accent))}
.opt:disabled{cursor:default}
.opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fb p{margin:0;flex:1;min-width:200px}
.fb b.good{color:var(--good)} .fb b.bad{color:var(--bad)}
.result{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 18px}
.result .big{font-family:var(--display);font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.result .stars{font-size:1.8rem}
.result p{color:var(--muted)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* order game */
.chain{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px;counter-reset:s}
.chain li{counter-increment:s;background:var(--good-bg);border:1px solid var(--good);border-radius:10px;padding:8px 12px 8px 44px;position:relative;animation:pop .25s}
.chain li::before{content:counter(s);position:absolute;left:10px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--good);color:var(--surface);font-size:.8rem;font-weight:700;display:grid;place-items:center}
.chain li.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--muted);animation:none}
.chain li.ghost::before{background:var(--line);color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool button{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;font-weight:500}
.pool button:hover{border-color:var(--c,var(--accent))}
.shake{animation:shake .35s;border-color:var(--bad)!important;background:var(--bad-bg)!important}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes pop{from{transform:scale(.92);opacity:.4}}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 12px}

/* sort game */
.sort-item{background:var(--surface);border:2px solid var(--c);border-radius:16px;padding:20px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.25rem;margin-bottom:14px;animation:pop .25s}
.sort-item small{display:block;font-family:var(--body);font-weight:500;font-size:.78rem;color:var(--muted);margin-bottom:4px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.bin{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:84px}
.bin:hover{border-color:var(--c)}
.bin b{font-size:.92rem}
.bin ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.bin li{background:var(--good-bg);color:var(--ink);border-radius:6px;padding:2px 7px;font-size:.76rem}
/* football */
.league{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.league div{background:var(--surface);padding:10px 14px}
.league small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.league b{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.league b span{font-size:.8rem;color:var(--muted);font-weight:500}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--pitch);color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:12px;position:relative;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 40px,transparent 40px 80px)}
.board span{font-weight:700;font-size:.85rem;letter-spacing:.04em}
.board span:last-of-type{text-align:right}
.board b{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.35);border-radius:8px;padding:2px 14px;white-space:nowrap}
.board b.goal{animation:pop .4s}
.board em{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font-style:normal;font-size:.7rem;font-weight:700;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:0 8px}
.vs{font-size:.8rem;font-weight:600;color:var(--c)}
.res{font-weight:700}
.res.r3{color:var(--good)} .res.r1{color:var(--c2)} .res.r0{color:var(--bad)}
.pitch{margin-top:16px;border-radius:var(--r);padding:14px 16px;background:var(--pitch);color:#fff;
  background-image:linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.35) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 30px,transparent 30px 60px)}
.pitch small{font-weight:700;letter-spacing:.08em;font-size:.72rem;text-transform:uppercase;opacity:.85}
.pitch p{margin:4px 0 0;text-shadow:0 1px 2px rgba(0,0,0,.3)}
@media (max-width:520px){.league{grid-template-columns:repeat(2,minmax(0,1fr))}.board b{font-size:1.4rem;padding:2px 10px}}
.group-title{font-size:1rem;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.group-title::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c)}

/* rapid */
.timer{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--on-c);background:var(--c);border-radius:6px;padding:2px 8px}

.confetti{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall linear forwards;z-index:20}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}

@media (max-width:620px){
  .hero{grid-template-columns:1fr}
  .cell{grid-template-columns:1fr}
  .fc{height:250px}
}

/* glass layer: translucent material for navigation and controls, never nested inside other glass */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  background:radial-gradient(46vmax 40vmax at 8% 4%,var(--orb-1),transparent 70%),radial-gradient(42vmax 38vmax at 96% 18%,var(--orb-2),transparent 70%),
  radial-gradient(40vmax 36vmax at 88% 92%,var(--orb-3),transparent 70%),radial-gradient(38vmax 34vmax at 6% 88%,var(--orb-4),transparent 70%)}
.ambient::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--line-pitch) 0 72px,transparent 72px 144px);opacity:.38}
.ambient::after{content:"";position:absolute;left:50%;top:50%;width:min(64vmin,460px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--line-pitch);border-radius:50%}
.top,.tabs,.slide,.opt,.pool button,.bin,.back,.rapid-cta,.board{
  border:1px solid var(--glass-edge);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 1px 0 var(--sheen),inset 0 -1px 0 var(--glass-low),0 12px 30px -18px var(--glass-shadow)}
.top,.tabs,.slide,.opt,.pool button,.bin,.back{background:linear-gradient(140deg,var(--sheen),transparent 46%),var(--glass)}
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;flex-wrap:nowrap;border-radius:999px;padding:7px 10px 7px 14px;margin-bottom:20px;background:linear-gradient(140deg,var(--sheen),transparent 46%),var(--glass-strong)}
.brand{white-space:nowrap}
.meter{background:none;border:0;padding:0;white-space:nowrap}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:4;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-radius:999px;overflow:visible;background:linear-gradient(140deg,var(--sheen),transparent 46%),var(--glass-strong)}
.tabs i{position:absolute;inset:5px auto 5px 5px;width:calc((100% - 12px)/4);border-radius:999px;background:var(--surface);box-shadow:0 2px 8px -3px var(--glass-shadow);transform:translateX(calc(var(--i,0)*100%));transition:transform .34s cubic-bezier(.22,1,.36,1)}
.tabs button{position:relative;padding:8px 4px;border-radius:999px;transition:color .2s}
.tabs button[aria-selected="true"]{background:none;box-shadow:none}
.back{border-radius:999px;padding:6px 14px;color:var(--ink);margin-bottom:12px}
.slide{border-radius:18px}
.slide .label{border-right:1px solid var(--glass-edge)}
.slide p,.slide .meta{color:var(--ink);opacity:.78}
.opt{border-width:1px}
.opt.ok{background:var(--good-bg);border-color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.rapid-cta{color:#fff;background:linear-gradient(140deg,rgba(255,255,255,.1),transparent 46%),color-mix(in srgb,var(--pitch) 95%,transparent)}
.rapid-cta .btn{background:#fff;color:#12261F;box-shadow:none}
.board{background:linear-gradient(140deg,rgba(255,255,255,.1),transparent 46%),color-mix(in srgb,var(--pitch) 95%,transparent)}
.hero p,.hint,.qhead{color:var(--ink)}
.hero p,.hint{opacity:.82}
.btn{border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -10px var(--accent);transition:transform .16s ease-out}
.btn.ghost{background:var(--glass);border-color:var(--line);box-shadow:inset 0 1px 0 var(--sheen)}
.slide,.opt,.pool button,.bin,.back{transition:transform .16s ease-out,border-color .15s,background .15s}
.btn:active,.opt:active:not(:disabled),.pool button:active,.bin:active,.slide:active,.back:active{transform:scale(.97)}
@media (hover:none){.slide:hover{transform:none;box-shadow:inset 0 1px 0 var(--sheen),inset 0 -1px 0 var(--glass-low),0 12px 30px -18px var(--glass-shadow)}}
@media (max-width:430px){.brand{font-size:1rem;gap:7px}.brand svg{width:28px;height:28px}.rank{font-size:.76rem;padding:3px 8px}.xp{font-size:.8rem}.meter{gap:6px}.top{padding-inline:10px 8px}.tabs button{font-size:.88rem}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root:root:root{--glass:var(--surface);--glass-strong:var(--surface)}}
@media (prefers-reduced-transparency:reduce){:root:root:root{--glass:var(--surface);--glass-strong:var(--surface);--glass-blur:none;--sheen:transparent}.ambient{display:none}.rapid-cta,.board{background:var(--pitch)}}
@media (prefers-contrast:more){:root:root:root{--glass:var(--surface);--glass-strong:var(--surface);--glass-edge:var(--ink);--line:var(--ink)}}
</style>
</head>

<div class="app">

  if(reduce)return;
  const cols=['--c1','--c2','--c3','--c4','--c5','--c6'];
  for(let i=0;i<36;i++){const d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';
    d.style.background=`var(${cols[i%6]})`;d.style.animationDuration=(1.6+Math.random()*1.4)+'s';d.style.animationDelay=Math.random()*.4+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}
}

/* ---------- home ---------- */
function home(){
  const {r,next}=rankOf(S.xp);
  const pct=next?Math.round((S.xp-r[0])/(next[0]-r[0])*100):100;
  const played=CH.filter(c=>S.match[c.id]);
  const w=played.filter(c=>S.match[c.id].pts===3).length,d=played.filter(c=>S.match[c.id].pts===1).length;
  const leaguePts=played.reduce((a,c)=>a+S.match[c.id].pts,0);
  view.innerHTML=`
  <section class="hero">
    <div><h1>Η σεζόν της Βιολογίας</h1>
    <p>Κάθε ενότητα του βιβλίου είναι ένας αγώνας. Διάβασε τη θεωρία (προπόνηση), γύρνα τις κάρτες (τακτική) και μπες στο γήπεδο: κάθε σωστή απάντηση είναι γκολ, κάθε λάθος γκολ του αντιπάλου. Από τις ακαδημίες μέχρι τη Χρυσή Μπάλα.</p></div>
    <div class="progress-card"><small>Η ΚΑΡΙΕΡΑ ΣΟΥ</small><b>${r[1]}</b>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="next">${next?`${next[0]-S.xp} XP για «${next[1]}»`:'Είσαι ο καλύτερος της σεζόν!'}</div></div>
  </section>
  <section class="league">
    <div><small>ΒΑΘΜΟΙ</small><b>${leaguePts}<span>/${CH.length*3}</span></b></div>
    <div><small>ΑΓΩΝΕΣ</small><b>${played.length}<span>/${CH.length}</span></b></div>
    <div><small>Ν–Ι–Η</small><b>${w}–${d}–${played.length-w-d}</b></div>
    <div><small>ΡΕΚΟΡ ΠΕΝΑΛΤΙ</small><b>${S.rapid}</b></div>
  </section>
  <section class="rapid-cta"><div><h2>Διαδικασία πέναλτι · 60 δευτερόλεπτα</h2><p>Ερωτήσεις από όλες τις ενότητες. Κάθε σωστή απάντηση είναι ένα πέναλτι στα δίχτυα.</p></div>
    <button class="btn" id="go-rapid">Στην άσπρη βούλα</button></section>
  ${GROUPS.map(g=>`<h2 class="group-title" style="--c:${g.c}">${g.name}</h2>
  <div class="slides">${g.units.map(id=>CH.find(c=>c.id===id)).map(ch=>`
    <button class="slide" data-ch="${ch.id}" style="--c:${ch.c}">
      <span class="label"><span>${ch.id==='sci'?'ΕΙΣΑΓ.':'ΕΝΟΤ.'}</span><b>${ch.id==='sci'?'0':ch.n}</b></span>
      <span class="body"><h3>${ch.title}</h3><p>${ch.sub}</p>
        <span class="vs">vs ${FOOT[ch.id].opp}</span>
        <span class="meta">${S.match[ch.id]?`<span class="res r${S.match[ch.id].pts}">${S.match[ch.id].txt} ${S.match[ch.id].score}</span>`:'<span>Δεν έχει παιχτεί</span>'}${S.game[ch.id]?'<span>· παιχνίδι ✓</span>':''}</span></span>
    </button>`).join('')}</div>`).join('')}`;
  view.querySelectorAll('.slide').forEach(b=>b.onclick=()=>chapter(b.dataset.ch,'theory'));
  $('#go-rapid').onclick=rapid;
}

/* ---------- chapter ---------- */
const TABS=[['theory','Θεωρία'],['cards','Κάρτες'],['quiz','Quiz'],['game','Παιχνίδι']];
const unitLabel=ch=>ch.id==='sci'?'ΕΙΣΑΓΩΓΗ':'ΕΝΟΤΗΤΑ '+ch.n;
let lastTab={id:null,i:0};
function chapter(id,tab){
  const ch=CH.find(c=>c.id===id);
  const ti=TABS.findIndex(t=>t[0]===tab),from=lastTab.id===id?lastTab.i:ti;
  lastTab={id,i:ti};
  view.innerHTML=`<button class="back" id="back">← Όλες οι ενότητες</button>
  <div class="ch-head" style="--c:${ch.c}"><small>${unitLabel(ch)}</small><h1>${ch.title}</h1></div>
  <div class="tabs" role="tablist" style="--i:${from}"><i aria-hidden="true"></i>${TABS.map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k===tab}">${l}</button>`).join('')}</div>
  <div id="tab" style="--c:${ch.c}"></div>`;
  const tabs=$('.tabs');void tabs.offsetWidth;tabs.style.setProperty('--i',ti);
  $('#back').onclick=home;
  view.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>chapter(id,b.dataset.t));
  ({theory,cards,quiz,game:ch=>ch.game.type==='sort'?sortGame(ch):order(ch)})[tab](ch);
  window.scrollTo({top:0});
}

function theory(ch){
  const box=$('#tab');
  box.innerHTML=(ch.id==='cell'?`<h2 class="section-title">Δες ένα κύτταρο στο μικροσκόπιο</h2><div class="cell" id="cellx"></div>`:'')+
  `<h2 class="section-title">Τα βασικά</h2><ul class="points">${ch.points.map(p=>`<li>${p}</li>`).join('')}</ul>
  <div class="pitch"><small>ΣΤΟ ΓΗΠΕΔΟ</small><p>${FOOT[ch.id].pitch}</p></div>
  <div class="fact"><small>ΗΞΕΡΕΣ ΟΤΙ;</small><p>${ch.fact}</p></div>
  <div class="row" style="justify-content:flex-start;margin-top:18px"><button class="btn" id="to-quiz">Είμαι έτοιμος/η για το quiz</button><button class="btn ghost" id="to-cards">Κάρτες πρώτα</button></div>`;
  $('#to-quiz').onclick=()=>chapter(ch.id,'quiz');
  $('#to-cards').onclick=()=>chapter(ch.id,'cards');
  if(ch.id==='cell')cellExplorer('plant','nucleus');
}

function cellExplorer(kind,sel){
  const parts=kind==='plant'?PLANT_PARTS:ANIMAL_PARTS;
  if(!parts.includes(sel))sel='nucleus';
  const el=$('#cellx');
  el.innerHTML=`<div><div class="tog"><button data-k="plant" aria-pressed="${kind==='plant'}">Φυτικό</button><button data-k="animal" aria-pressed="${kind==='animal'}">Ζωικό</button></div>
    ${kind==='plant'?SVG_PLANT:SVG_ANIMAL}<div class="mag">ΜΕΓΕΘΥΝΣΗ ×400 · πάτα ένα οργανίδιο</div></div>
    <div><div class="chips">${parts.map(p=>`<button data-sel="${p}" class="${p===sel?'on':''}">${CELL[p][0]}</button>`).join('')}</div>
    <div class="info" aria-live="polite"><h3>${CELL[sel][0]}</h3><p>${CELL[sel][1]}</p></div></div>`;
  el.querySelectorAll('[data-p]').forEach(n=>{if(n.dataset.p===sel)n.classList.add('on');n.addEventListener('click',()=>cellExplorer(kind,n.dataset.p))});
  el.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>cellExplorer(kind,b.dataset.sel));
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>cellExplorer(b.dataset.k,sel));
}

function cards(ch){
  const box=$('#tab');let deck=[...ch.cards],k=0;
  function show(){
    const [t,d]=deck[k];
    box.innerHTML=`<p class="hint" style="text-align:center">Πάτα την κάρτα για να δεις τον ορισμό.</p>
    <div class="fc-wrap"><button class="fc" id="fc" aria-label="Γύρισε την κάρτα">
      <span class="face front"><small>ΟΡΟΣ</small><b>${t}</b></span>
      <span class="face back"><small>ΟΡΙΣΜΟΣ</small><span>${d}</span></span></button></div>
    <div class="fc-nav"><button class="btn ghost" id="prev">← Πίσω</button><span>${k+1} / ${deck.length}</span><button class="btn ghost" id="mix">Ανακάτεμα</button><button class="btn" id="next">Επόμενη →</button></div>`;
    $('#fc').onclick=()=>$('#fc').classList.toggle('flip');
    $('#prev').onclick=()=>{k=(k-1+deck.length)%deck.length;show()};
    $('#next').onclick=()=>{k=(k+1)%deck.length;show()};
    $('#mix').onclick=()=>{deck=shuffle(deck);k=0;show()};
  }
  show();
}

function quiz(ch){
  const box=$('#tab');
  const qs=shuffle(ch.quiz).map(q=>({...q,opts:shuffle(q.a.map((t,i)=>({t,ok:i===0})))}));
  let i=0,score=0,opp=0,combo=0,gained=0;
  const team=FOOT[ch.id].opp;
  function show(){
    const q=qs[i];
    box.innerHTML=`<div class="board"><span>ΕΣΥ</span><b id="sb">${score} – ${opp}</b><span>${team}</span><em>${Math.round(i/qs.length*90)}΄</em></div>
    <div class="qhead"><span>Φάση ${i+1} / ${qs.length}</span><span class="combo">${combo>=2?'Χατ τρικ σε εξέλιξη ×'+combo:''}</span></div>
    <div class="bar"><i style="width:${i/qs.length*100}%;background:${ch.c}"></i></div>
    <h3 class="q">${q.q}</h3><div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join('')}</div><div id="fb"></div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  }
  function pick(k){
    const q=qs[i],btns=box.querySelectorAll('.opt'),ok=q.opts[k].ok;
    btns.forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add('ok')});
    if(ok){score++;combo++;const pts=combo>=3?15:10;gained+=pts;addXP(pts)}else{opp++;combo=0;btns[k].classList.add('bad')}
    const sb=$('#sb');sb.textContent=`${score} – ${opp}`;sb.classList.add('goal');
    $('#fb').innerHTML=`<div class="fb"><p>${ok?'<b class="good">ΓΚΟΛ!</b> ':'<b class="bad">Σκόραρε ο αντίπαλος.</b> '}${q.why}</p><button class="btn" id="nx">${i<qs.length-1?'Επόμενη φάση':'Τελικό σφύριγμα'}</button></div>`;
    $('#nx').onclick=()=>{i++;i<qs.length?show():end()};
    $('#nx').focus();
  }
  function end(){
    const st=starsFor(score,qs.length),prev=S.best[ch.id]||0;
    if(st>prev)S.best[ch.id]=st;
    const res=RESULT(score,opp),old=S.match[ch.id];
    if(!old||res.pts>old.pts||(res.pts===old.pts&&score-opp>old.diff))S.match[ch.id]={pts:res.pts,txt:res.txt,score:`${score}–${opp}`,diff:score-opp};
    save();
    if(res.pts===3)confetti();
    const msg=opp===0?'Καθαρή εστία! Τέλεια εμφάνιση, είσαι έτοιμος για διαγώνισμα.':res.pts===3?'Νίκη και 3 βαθμοί! Ξαναπαίξε το για ακόμα καλύτερο σκορ.':res.pts===1?'Ισοπαλία. Μια ματιά στις κάρτες και η νίκη είναι δική σου.':'Ήττα αυτή τη φορά. Κάνε προπόνηση στη θεωρία και ζήτα ρεβάνς!';
    box.innerHTML=`<div class="result"><p>Τελικό σφύριγμα</p><div class="big">${score} – ${opp}</div><p><b>${res.txt}</b> απέναντι στην ${team} · ${res.pts} ${res.pts===1?'βαθμός':'βαθμοί'}</p>${starsHTML(st)}<p>${msg}<br>Κέρδισες ${gained} XP.</p>
      <div class="row"><button class="btn" id="again">Ρεβάνς</button><button class="btn ghost" id="toorder">Παιχνίδι</button><button class="btn ghost" id="tohome">Ενότητες</button></div></div>`;
    $('#again').onclick=()=>quiz(ch);$('#toorder').onclick=()=>chapter(ch.id,'game');$('#tohome').onclick=home;
  }
  show();
}

function gameDone(ch,mistakes,body){
  const pts=Math.max(5,30-mistakes*5);addXP(pts);
  if(!S.game[ch.id]){S.game[ch.id]=true;save()}
  if(mistakes===0)confetti();
  $('#tab').innerHTML=`<h2 class="section-title" style="margin-top:0">${ch.game.title}</h2>${body}
  <div class="result"><div class="big">${mistakes===0?'Χωρίς λάθος!':mistakes+(mistakes===1?' λάθος':' λάθη')}</div><p>Κέρδισες ${pts} XP.</p>
  <div class="row"><button class="btn" id="again">Ξανά</button><button class="btn ghost" id="tohome">Ενότητες</button></div></div>`;
  $('#again').onclick=()=>chapter(ch.id,'game');$('#tohome').onclick=home;
}

function sortGame(ch){
  const box=$('#tab'),g=ch.game,deck=shuffle(g.items),placed=g.bins.map(()=>[]);
  let k=0,mistakes=0;
  const binsHTML=()=>`<div class="bins">${g.bins.map((b,i)=>`<button class="bin" data-b="${i}"><b>${b}</b><ul>${placed[i].map(t=>`<li>${t}</li>`).join('')}</ul></button>`).join('')}</div>`;
  function show(){
    box.innerHTML=`<h2 class="section-title" style="margin-top:0">${g.title}</h2><p class="hint">${g.hint} Λάθη: <b>${mistakes}</b></p>
    <div class="sort-item"><small>${k+1} από ${deck.length}</small>${deck[k][0]}</div>${binsHTML()}`;
    box.querySelectorAll('.bin').forEach(b=>b.onclick=()=>tap(b,+b.dataset.b));
  }
  function tap(b,i){
    if(deck[k][1]===i){placed[i].push(deck[k][0]);k++;k===deck.length?gameDone(ch,mistakes,binsHTML().replace(/<button/g,'<div').replace(/<\/button>/g,'</div>')):show()}
    else{mistakes++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');box.querySelector('.hint b').textContent=mistakes}
  }
  show();
}

function order(ch){
  const box=$('#tab'),items=ch.game.items;
  let pool=shuffle(items.map((t,i)=>({t,i}))),next=0,mistakes=0;
  function show(){
    box.innerHTML=`<h2 class="section-title" style="margin-top:0">${ch.game.title}</h2><p class="hint">${ch.game.hint} Λάθη: <b>${mistakes}</b></p>
    <ol class="chain">${items.slice(0,next).map(t=>`<li>${t}</li>`).join('')}${next<items.length?'<li class="ghost">;</li>':''}</ol>
    <div class="pool">${pool.map(p=>`<button data-i="${p.i}">${p.t}</button>`).join('')}</div>`;
    box.querySelectorAll('.pool button').forEach(b=>b.onclick=()=>tap(b,+b.dataset.i));
  }
  function tap(b,i){
    if(i===next){next++;pool=pool.filter(p=>p.i!==i);next===items.length?gameDone(ch,mistakes,`<ol class="chain">${items.map(t=>`<li>${t}</li>`).join('')}</ol>`):show()}
    else{mistakes++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');box.querySelector('.hint b').textContent=mistakes}
  }
  show();
}

/* ---------- rapid round ---------- */
let rapidTimer=null;
function rapid(){
  clearInterval(rapidTimer);
  const all=shuffle(CH.flatMap(ch=>ch.quiz.map(q=>({...q,ch}))));
  let i=0,score=0,left=60,locked=false;
  view.innerHTML=`<button class="back" id="back">← Έξοδος</button>
  <div class="qhead" style="align-items:center"><span class="timer" id="t">60</span><span>Γκολ: <b id="sc">0</b> · Ρεκόρ: ${S.rapid}</span></div>
  <div class="bar"><i id="tb" style="width:100%"></i></div><div id="rq"></div>`;
  $('#back').onclick=()=>{clearInterval(rapidTimer);home()};
  function show(){
    const q=all[i%all.length],opts=shuffle(q.a.map((t,k)=>({t,ok:k===0})));locked=false;
    $('#rq').innerHTML=`<div style="--c:${q.ch.c};margin-top:16px"><span class="tag">${unitLabel(q.ch)}</span><h3 class="q">${q.q}</h3>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join('')}</div></div>`;
    $('#rq').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(locked)return;locked=true;const o=opts[+b.dataset.k];
      $('#rq').querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(opts[j].ok)x.classList.add('ok')});
      if(o.ok){score++;$('#sc').textContent=score}else b.classList.add('bad');
      setTimeout(()=>{if(left>0){i++;show()}},o.ok?450:1100);
    });
  }
  rapidTimer=setInterval(()=>{left--;const t=$('#t');if(!t){clearInterval(rapidTimer);return}
    t.textContent=left;t.classList.toggle('low',left<=10);$('#tb').style.width=(left/60*100)+'%';
    if(left<=0){clearInterval(rapidTimer);end()}},1000);
  function end(){
    const rec=score>S.rapid;if(rec){S.rapid=score;save();confetti()}
    if(score)addXP(score*5);
    view.innerHTML=`<div class="result"><p>Τέλος η διαδικασία πέναλτι!</p><div class="big">${score} γκολ</div>
      <p>${rec?'Νέο ρεκόρ!':'Ρεκόρ σου: '+S.rapid}<br>Κέρδισες ${score*5} XP.</p>
      <div class="row"><button class="btn" id="again">Ξανά</button><button class="btn ghost" id="tohome">Κεφάλαια</button></div></div>`;
    $('#again').onclick=rapid;$('#tohome').onclick=home;
  }
  show();
}

document.documentElement.lang='el';
$('#home').onclick=()=>{clearInterval(rapidTimer);home()};
renderTop();home();
</script>
</body>
</html>
